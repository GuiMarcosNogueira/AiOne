name: openrouter
base_url: https://openrouter.ai/api/v1
auth:
  type: bearer
  value_from_env: OPENROUTER_API_KEY
headers:
  HTTP-Referer: ${OPENROUTER_APP_URL}
  X-Title: ${OPENROUTER_APP_NAME}
timeout_seconds: 30
capabilities:
  limits:
    max_text_tokens: 4096
  attributes:
    cost_score: 4
    latency_score: 5
    quality_score: 6
endpoints:
  text:
    method: POST
    path: /chat/completions
    request:
      content_type: application/json
      body: |
        {
          "model": "{{ if .model }}{{ .model }}{{ else }}meta-llama/llama-3.1-8b-instruct{{ end }}",
          "messages": [
            {"role": "user", "content": {{ toJSON .prompt }} }
          ],
          "max_tokens": {{ if .max_tokens }}{{ .max_tokens }}{{ else }}1024{{ end }},
          "temperature": {{ if .temperature }}{{ .temperature }}{{ else }}1{{ end }}
        }
    response:
      text_path: choices.0.message.content
