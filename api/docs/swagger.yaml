basePath: /
consumes:
- application/json
definitions:
  auth.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.RefreshInput:
    properties:
      refresh_token:
        type: string
    type: object
  auth.RegisterInput:
    properties:
      display_name:
        type: string
      email:
        type: string
      locale:
        type: string
      password:
        type: string
      preferences:
        additionalProperties: {}
        type: object
      timezone:
        type: string
    type: object
  dto.EmbeddingsReq:
    properties:
      inputs:
        items:
          type: string
        type: array
      model:
        type: string
      provider:
        type: string
    type: object
  dto.ImageEditReq:
    properties:
      image_base64:
        type: string
      image_url:
        type: string
      mask_base64:
        type: string
      mask_url:
        type: string
      media:
        items:
          $ref: '#/definitions/dto.MediaInput'
        type: array
      prompt:
        type: string
      provider:
        type: string
      size:
        type: string
    type: object
  dto.ImageReq:
    properties:
      media:
        items:
          $ref: '#/definitions/dto.MediaInput'
        type: array
      prompt:
        type: string
      provider:
        type: string
      size:
        type: string
    type: object
  dto.MediaInput:
    properties:
      data:
        type: string
      mime_type:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  dto.ModerationReq:
    properties:
      input:
        type: string
      provider:
        type: string
    type: object
  dto.STTReq:
    properties:
      audio_url:
        type: string
      language:
        type: string
      provider:
        type: string
    type: object
  dto.TTSReq:
    properties:
      language:
        type: string
      provider:
        type: string
      text:
        type: string
      voice:
        type: string
    type: object
  dto.TextReq:
    properties:
      max_tokens:
        type: integer
      media:
        items:
          $ref: '#/definitions/dto.MediaInput'
        type: array
      prompt:
        type: string
      provider:
        type: string
      temperature:
        type: number
    type: object
  dto.VideoReq:
    properties:
      duration_seconds:
        type: integer
      media:
        items:
          $ref: '#/definitions/dto.MediaInput'
        type: array
      prompt:
        type: string
      provider:
        type: string
    type: object
  handlers.ProviderSessionCreateRequest:
    properties:
      expires_at:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      title:
        type: string
    type: object
  handlers.ResponseEnvelope:
    properties:
      data: {}
      error:
        type: string
      provider:
        type: string
      session:
        $ref: '#/definitions/providersessions.SessionDetails'
    type: object
  handlers.SessionAudioRequest:
    properties:
      audio_url:
        type: string
      expires_at:
        type: string
      language:
        type: string
      provider_key:
        type: string
      session_id:
        type: string
      session_metadata:
        additionalProperties: {}
        type: object
      session_title:
        type: string
    type: object
  handlers.SessionImageEditRequest:
    properties:
      expires_at:
        type: string
      image_base64:
        type: string
      image_url:
        type: string
      mask_base64:
        type: string
      mask_url:
        type: string
      media:
        items:
          $ref: '#/definitions/dto.MediaInput'
        type: array
      prompt:
        type: string
      provider_key:
        type: string
      session_id:
        type: string
      session_metadata:
        additionalProperties: {}
        type: object
      session_title:
        type: string
      size:
        type: string
    type: object
  handlers.SessionImageRequest:
    properties:
      expires_at:
        type: string
      media:
        items:
          $ref: '#/definitions/dto.MediaInput'
        type: array
      prompt:
        type: string
      provider_key:
        type: string
      session_id:
        type: string
      session_metadata:
        additionalProperties: {}
        type: object
      session_title:
        type: string
      size:
        type: string
    type: object
  handlers.SessionMessageRequest:
    properties:
      expires_at:
        type: string
      max_tokens:
        type: integer
      media:
        items:
          $ref: '#/definitions/dto.MediaInput'
        type: array
      prompt:
        type: string
      provider_key:
        type: string
      session_id:
        type: string
      session_metadata:
        additionalProperties: {}
        type: object
      session_title:
        type: string
      temperature:
        type: number
    type: object
  handlers.SessionVideoRequest:
    properties:
      duration_seconds:
        type: integer
      expires_at:
        type: string
      media:
        items:
          $ref: '#/definitions/dto.MediaInput'
        type: array
      prompt:
        type: string
      provider_key:
        type: string
      session_id:
        type: string
      session_metadata:
        additionalProperties: {}
        type: object
      session_title:
        type: string
    type: object
  providersessions.SessionDetails:
    properties:
      archived_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      last_interaction:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      provider_name:
        type: string
      title:
        type: string
      total_tokens_used:
        type: integer
    type: object
info:
  contact: {}
  description: Unified AI gateway that proxies multiple providers.
  title: AiOne API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ResponseEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ResponseEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ResponseEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ResponseEnvelope'
      summary: Log in
      tags:
      - auth
  /auth/logout:
