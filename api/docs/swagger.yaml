          schema:
            $ref: '#/definitions/handlers.ResponseEnvelope'
      security:
      - BearerAuth: []
      summary: List provider sessions
      tags:
      - provider_sessions
    post:
      consumes:
      - application/json
      parameters:
      - description: Provider name
        in: path
        name: provider
        required: true
        type: string
      - description: Session payload
        in: body
