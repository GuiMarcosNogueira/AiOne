openapi: 3.0.3
info:
  title: AI Aggregator API
  version: 0.1.0
  description: REST interface that proxies multimodal AI requests to registered providers.
servers:
  - url: http://localhost:8080
paths:
  /v1/chat:
    post:
      summary: Generate text content using the default provider.
      tags: [chat]
      parameters:
        - $ref: '#/components/parameters/StrategyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextReq'
      responses:
        '200':
          description: Generated text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextRespEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/image:
    post:
      summary: Generate an image from a text prompt.
      tags: [image]
      parameters:
        - $ref: '#/components/parameters/StrategyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageReq'
      responses:
        '200':
          description: Generated image metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageRespEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/video:
    post:
      summary: Generate a short-form video.
      tags: [video]
      parameters:
        - $ref: '#/components/parameters/StrategyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoReq'
      responses:
        '200':
          description: Generated video metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoRespEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/stt:
    post:
      summary: Run speech-to-text transcription.
      tags: [speech]
      parameters:
        - $ref: '#/components/parameters/StrategyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/STTReq'
      responses:
        '200':
          description: Transcript payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STTRespEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tts:
    post:
      summary: Run text-to-speech synthesis.
      tags: [speech]
      parameters:
        - $ref: '#/components/parameters/StrategyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSReq'
      responses:
        '200':
          description: Synthesized audio reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSRespEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/embeddings:
    post:
      summary: Generate vector embeddings for inputs.
      tags: [embeddings]
      parameters:
        - $ref: '#/components/parameters/StrategyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsReq'
      responses:
        '200':
          description: Embedding vectors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsRespEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/moderation:
    post:
      summary: Run safety moderation checks on input text.
      tags: [moderation]
      parameters:
        - $ref: '#/components/parameters/StrategyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationReq'
      responses:
        '200':
          description: Moderation verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationRespEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/providers:
    get:
      summary: List registered upstream providers.
      tags: [providers]
      responses:
        '200':
          description: Active providers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersRespEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    StrategyParam:
      name: strategy
      in: query
      description: Optional routing strategy (first, fast, cheap, bestOf)
      required: false
      schema:
        type: string
        enum: [first, fast, cheap, bestOf]
  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResp'
    InternalError:
      description: Provider execution failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResp'
    Unavailable:
      description: No providers registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResp'
  schemas:
    ErrorResp:
      type: object
      properties:
        error:
          type: string
        provider:
          type: string
      additionalProperties: false
    TextReq:
      type: object
      properties:
        provider:
          type: string
          description: Optional explicit provider identifier to override routing.
        prompt:
          type: string
        max_tokens:
          type: integer
        temperature:
          type: number
          format: float
      required: [prompt]
    TextResp:
      type: object
      properties:
        content:
          type: string
      required: [content]
    ImageReq:
      type: object
      properties:
        provider:
          type: string
          description: Optional explicit provider identifier to override routing.
        prompt:
          type: string
        size:
          type: string
      required: [prompt]
    ImageResp:
      type: object
      properties:
        url:
          type: string
          format: uri
      required: [url]
    VideoReq:
      type: object
      properties:
        provider:
          type: string
          description: Optional explicit provider identifier to override routing.
        prompt:
          type: string
        duration_seconds:
          type: integer
      required: [prompt]
    VideoResp:
      type: object
      properties:
        url:
          type: string
          format: uri
      required: [url]
    STTReq:
      type: object
      properties:
        provider:
          type: string
          description: Optional explicit provider identifier to override routing.
        audio_url:
          type: string
          format: uri
        language:
          type: string
      required: [audio_url]
    STTResp:
      type: object
      properties:
        transcript:
          type: string
      required: [transcript]
    TTSReq:
      type: object
      properties:
        provider:
          type: string
          description: Optional explicit provider identifier to override routing.
        text:
          type: string
        voice:
          type: string
        language:
          type: string
      required: [text]
    TTSResp:
      type: object
      properties:
        audio_url:
          type: string
          format: uri
      required: [audio_url]
    EmbeddingsReq:
      type: object
      properties:
        provider:
          type: string
          description: Optional explicit provider identifier to override routing.
        inputs:
          type: array
          items:
            type: string
        model:
          type: string
      required: [inputs]
    EmbeddingsResp:
      type: object
      properties:
        vectors:
          type: array
          items:
            type: array
            items:
              type: number
              format: float
      required: [vectors]
    ModerationReq:
      type: object
      properties:
        provider:
          type: string
          description: Optional explicit provider identifier to override routing.
        input:
          type: string
      required: [input]
    ModerationResp:
      type: object
      properties:
        flagged:
          type: boolean
        reason:
          type: string
    ProvidersResp:
      type: object
      properties:
        providers:
          type: array
          items:
            type: string
        matrix:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityMatrixEntry'
      required: [providers, matrix]
    CapabilityMatrixEntry:
      type: object
      properties:
        name:
          type: string
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      required: [name, capabilities]
    Capabilities:
      type: object
      properties:
        text_generation:
          type: boolean
        image_generation:
          type: boolean
        video_generation:
          type: boolean
        speech_to_text:
          type: boolean
        text_to_speech:
          type: boolean
        embeddings:
          type: boolean
        moderation:
          type: boolean
        limits:
          $ref: '#/components/schemas/CapabilityLimits'
        attributes:
          $ref: '#/components/schemas/CapabilityAttributes'
    CapabilityLimits:
      type: object
      properties:
        max_text_tokens:
          type: integer
        max_image_resolution:
          type: string
        max_embedding_dimensions:
          type: integer
    CapabilityAttributes:
      type: object
      properties:
        cost_score:
          type: integer
        latency_score:
          type: integer
        quality_score:
          type: integer
        rate_limit_rps:
          type: number
    TextRespEnvelope:
      type: object
      properties:
        provider:
          type: string
        data:
          $ref: '#/components/schemas/TextResp'
      required: [provider, data]
    ImageRespEnvelope:
      type: object
      properties:
        provider:
          type: string
        data:
          $ref: '#/components/schemas/ImageResp'
      required: [provider, data]
    VideoRespEnvelope:
      type: object
      properties:
        provider:
          type: string
        data:
          $ref: '#/components/schemas/VideoResp'
      required: [provider, data]
    STTRespEnvelope:
      type: object
      properties:
        provider:
          type: string
        data:
          $ref: '#/components/schemas/STTResp'
      required: [provider, data]
    TTSRespEnvelope:
      type: object
      properties:
        provider:
          type: string
        data:
          $ref: '#/components/schemas/TTSResp'
      required: [provider, data]
    EmbeddingsRespEnvelope:
      type: object
      properties:
        provider:
          type: string
        data:
          $ref: '#/components/schemas/EmbeddingsResp'
      required: [provider, data]
    ModerationRespEnvelope:
      type: object
      properties:
        provider:
          type: string
        data:
          $ref: '#/components/schemas/ModerationResp'
      required: [provider, data]
    ProvidersRespEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ProvidersResp'
      required: [data]
